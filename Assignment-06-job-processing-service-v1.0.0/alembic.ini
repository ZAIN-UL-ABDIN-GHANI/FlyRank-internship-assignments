[alembic]
script_location = app/db/migrations
prepend_sys_path = .

# sqlalchemy.url is intentionally omitted here - env.py reads it from
# app.core.config.settings.DATABASE_URL so there is exactly one source of
# truth for the connection string (SDD Section 5 - Assumptions).

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
