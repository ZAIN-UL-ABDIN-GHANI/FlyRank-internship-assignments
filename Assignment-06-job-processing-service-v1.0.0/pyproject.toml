[project]
name = "job-processing-service"
version = "1.0.0"
description = "Asynchronous background job processing system for long-running AI operations"
requires-python = ">=3.12,<3.14"
readme = "README.md"

# Dependencies are pinned in requirements.txt / requirements-dev.txt so that
# Docker builds can leverage layer caching on a single COPY + pip install
# step (see deploy/docker/Dockerfile.api and Dockerfile.worker).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
